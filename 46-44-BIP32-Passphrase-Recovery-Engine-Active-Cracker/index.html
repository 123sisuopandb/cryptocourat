<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>44. BIP32 Passphrase Recovery Engine (Active Cracker) - CGTTUBE</title>
    <link rel="stylesheet" href="../shared/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: var(--bg-dark, #121212); color: var(--text-light, #e0e0e0); margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .standalone-header { background: #1a1a1a; padding: 15px 20px; border-bottom: 1px solid #333; display: flex; align-items: center; justify-content: space-between; }
        .back-btn { background: transparent; border: 1px solid #444; color: #fff; padding: 8px 15px; border-radius: 5px; cursor: pointer; text-decoration: none; font-size: 14px; transition: 0.2s; }
        .back-btn:hover { background: #333; border-color: #666; }
        .tool-container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        #toolContent { background: #1e1e1e; padding: 25px; border-radius: 10px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        /* Ensure styles from original site apply properly by mocking the wrapper classes */
        .page.active { display: block !important; opacity: 1 !important; visibility: visible !important; position: static !important; }
    </style>
</head>
<body>
    <div class="standalone-header">
        <a href="../index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Suite</a>
        <h2 style="margin:0; font-size: 1.2rem; color: #00ff88;">44. BIP32 Passphrase Recovery Engine (Active Cracker)</h2>
    </div>

    <div class="tool-container">
        <!-- Replicating the structure needed by the original CSS -->
        <div class="page active">
            <div id="toolContent">
                <h3 style="color: #ffaa00;"><i class="fas fa-unlock-alt"></i> 44. BIP32 Passphrase Recovery Engine (Active
            Cracker)</h3>
        <p style="color: #aaa; font-size: 12px; margin-top: -5px;">Recover passwords using PBKDF2 Master Key fragments
            via Dictionary or Brute-Force.</p>

        <label style="font-size: 11px; color:#ffaa00;"> MASTER KEY FRAGMENT (EXTRACTED) - Support Multiple (One per
            line):</label>
        <textarea id="mkey_payload" rows="3"
            placeholder="Master Key Fragment (e.g., $bitcoin$64$...) - Paste one or more per line"
            style="border-color: #555; background: #000; font-family: monospace; color: #ffcc00; font-size: 12px; width:100%; margin-bottom:10px;"></textarea>

        <div style="margin-top:15px; background: #111; padding: 10px; border-radius: 8px;">
            <label style="font-size: 13px; color:#fff; font-weight:bold;">RECOVERY MODE:</label>
            <select id="crack_mode" onchange="toggleCrackUI()"
                style="width:auto; margin-left:10px; padding:5px; background:#222; color:#ffaa00; border:1px solid #444;">
                <option value="dict">Dictionary Attack (Paste guesses)</option>
                <option value="brute">Pure Brute-Force (Math Logic)</option>
            </select>
        </div>

        <!-- Dictionary UI -->
        <div id="gui_dict">
            <label style="font-size: 11px; color:#aaa; margin-top:10px; display:block;"> POTENTIAL PASSPHRASES (ONE PER
                LINE):</label>
            <textarea id="pass_list" rows="5" placeholder="Enter guesses..."></textarea>
            <input type="file" id="dict_file" accept=".txt"
                style="font-size:11px; padding:5px; margin-top:5px; border:1px dashed #444;"
                onchange="loadDictFile(this)">
        </div>

        <!-- Brute Force UI -->
        <div id="gui_brute"
            style="display:none; border: 1px solid #333; padding: 10px; margin-top:10px; background: rgba(255,170,0,0.05);">
            <div style="display:flex; gap:10px;">
                <div style="flex:1;">
                    <label style="font-size:11px; color:#aaa;">MIN LENGTH:</label>
                    <input type="number" id="brute_min" value="1" min="1" max="20" style="padding:5px;">
                </div>
                <div style="flex:1;">
                    <label style="font-size:11px; color:#aaa;">MAX LENGTH:</label>
                    <input type="number" id="brute_max" value="8" min="1" max="20" style="padding:5px;">
                </div>
            </div>

            <label style="font-size:11px; color:#aaa; margin-top:10px; display:block;">CHARACTER SET:</label>
            <select id="brute_charset"
                style="background:#222; color:#fff; border:1px solid #444; width:100%; padding:8px;">
                <option value="1">Lowercase letters (a-z)</option>
                <option value="2">Upper & Lowercase (a-Z)</option>
                <option value="3">Digits only (0-9)</option>
                <option value="4">Alphanumeric (a-Z, 0-9)</option>
                <option value="5">Full Set (Letters, Digits, Symbols)</option>
                <option value="6">Lowercase & Digits</option>
            </select>

            <div style="margin-top:10px; display:flex; gap:15px; flex-wrap:wrap;">
                <div style="display:flex; align-items:center; gap:8px;">
                    <input type="checkbox" id="brute_space" style="width:16px; height:16px; margin:0; cursor:pointer;">
                    <label for="brute_space" style="font-size:12px; color:#ffaa00; cursor:pointer;">Include Space ("
                        ")</label>
                </div>
                <div style="display:flex; align-items:center; gap:8px;">
                    <input type="checkbox" id="brute_random" style="width:16px; height:16px; margin:0; cursor:pointer;">
                    <label for="brute_random" style="font-size:12px; color:#ffaa00; cursor:pointer;">Random Mode (No
                        Repeats)</label>
                </div>
            </div>
        </div>

        <button id="btn_recover" onclick="processPassphraseRecovery()"
            style="background: #ffaa00; color: #000; font-weight: 900; letter-spacing: 1px; margin-top:15px;">
            START ENGINE RECOVERY
        </button>
        <button id="btn_stop" onclick="stopRecovery()"
            style="display:none; background: #ff3333; color: #fff; margin-top:10px;">STOP ENGINE</button>

        <pre id="out_cracker" style="max-height: 200px; font-size: 11px;">Awaiting instructions...</pre>
            </div>
        </div>
    </div>

    <!-- Core crypto library -->
    <script src="../shared/lib.js"></script>
    <!-- Tool specific logic -->
    <script src="script.js"></script>
</body>
</html>
