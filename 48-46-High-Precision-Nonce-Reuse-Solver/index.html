<body>
    <div class="standalone-header">
        <a href="../index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Suite</a>
        <h2 style="margin:0; font-size: 1.2rem; color: #00ff88;">46. High-Precision Nonce Reuse Solver</h2>
    </div>

    <div class="tool-container">
        <!-- Replicating the structure needed by the original CSS -->

        </div>

            style="background: #00ff00; color: #000; margin-top:15px; font-weight:bold;">EXTRACT PRIVATE KEY

        <pre id="out_nonce"
            style="margin-top:10px; font-size:11px; color: #00ff00; border:1px solid #003300; overflow-x:auto;"></pre>
