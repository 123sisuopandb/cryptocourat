<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>43. Shamir's Secret Sharing & Smart Key Joiner - CGTTUBE</title>
    <link rel="stylesheet" href="../shared/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: var(--bg-dark, #121212); color: var(--text-light, #e0e0e0); margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .standalone-header { background: #1a1a1a; padding: 15px 20px; border-bottom: 1px solid #333; display: flex; align-items: center; justify-content: space-between; }
        .back-btn { background: transparent; border: 1px solid #444; color: #fff; padding: 8px 15px; border-radius: 5px; cursor: pointer; text-decoration: none; font-size: 14px; transition: 0.2s; }
        .back-btn:hover { background: #333; border-color: #666; }
        .tool-container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        #toolContent { background: #1e1e1e; padding: 25px; border-radius: 10px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        /* Ensure styles from original site apply properly by mocking the wrapper classes */
        .page.active { display: block !important; opacity: 1 !important; visibility: visible !important; position: static !important; }
    </style>
</head>
<body>
    <div class="standalone-header">
        <a href="../index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Suite</a>
        <h2 style="margin:0; font-size: 1.2rem; color: #00ff88;">43. Shamir's Secret Sharing & Smart Key Joiner</h2>
    </div>

    <div class="tool-container">
        <!-- Replicating the structure needed by the original CSS -->
        <div class="page active">
            <div id="toolContent">
                <h3 style="color: #00bbff;"><i class="fas fa-puzzle-piece"></i> 43. Shamir's Secret Sharing & Smart Key Joiner
        </h3>
        <p style="color: #888; font-size: 12px; margin-top: -5px;">Reconstruct Private Keys from Fragmented Shards or
            Shamir Shares</p>

        <label style="font-size: 11px; color:#aaa;">Reconstruction Mode:</label>
        <select id="sss_mode"
            style="background:#111; color:#fff; border:1px solid #333; padding:5px; margin-bottom:10px;">
            <option value="concatenate">Simple Join (Small fragments)</option>
            <option value="shamir">Shamir's Logic (Lagrange Interpolation)</option>
            <option value="xor">XOR logic (Part A ^ Part B)</option>
        </select>

        <textarea id="sss_shares" rows="6"
            placeholder="Paste shards here (one per line, comma, or space)..."></textarea>

        <button onclick="processSSSJoiner()" style="background-color: #00bbff; color: white;">Solve & Reconstruct
            Key</button>
        <pre id="out_sss_joiner"></pre>
            </div>
        </div>
    </div>

    <!-- Core crypto library -->
    <script src="../shared/lib.js"></script>
    <!-- Tool specific logic -->
    <script src="script.js"></script>
</body>
</html>
