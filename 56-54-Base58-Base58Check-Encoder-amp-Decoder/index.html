<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: var(--bg-dark, #121212); color: var(--text-light, #e0e0e0); margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .standalone-header { background: #1a1a1a; padding: 15px 20px; border-bottom: 1px solid #333; display: flex; align-items: center; justify-content: space-between; }
        .back-btn { background: transparent; border: 1px solid #444; color: #fff; padding: 8px 15px; border-radius: 5px; cursor: pointer; text-decoration: none; font-size: 14px; transition: 0.2s; }
        .back-btn:hover { background: #333; border-color: #666; }
        .tool-container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        #toolContent { background: #1e1e1e; padding: 25px; border-radius: 10px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        /* Ensure styles from original site apply properly by mocking the wrapper classes */
        .page.active { display: block !important; opacity: 1 !important; visibility: visible !important; position: static !important; }
    </style>
</head>
<body>
    <div class="standalone-header">
        <a href="../index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Suite</a>
        <h2 style="margin:0; font-size: 1.2rem; color: #00ff88;">54. Base58 / Base58Check Encoder &amp; Decoder</h2>
    </div>

    <div class="tool-container">
        <!-- Replicating the structure needed by the original CSS -->
        <div class="page active">
            <div id="toolContent">
                <h3 style="color: var(--bitcoin-orange);"><i class="fas fa-exchange-alt"></i> 54. Base58 / Base58Check Encoder &amp; Decoder</h3>
        <p style="color:#bbb;font-size:14px;">Encode raw hex payloads into Base58 or Base58Check (with 4-byte double-SHA256 checksum) and decode Bitcoin addresses / WIF keys back to their version byte + payload.</p>
        <div class="input-group">
            <input id="b58_input" placeholder="Hex payload OR Base58 string...">
        </div>
        <div class="input-group" style="display:flex;gap:8px;flex-wrap:wrap;">
            <button onclick="b58Encode(false)" style="width:auto;padding:0 18px;">HEX → Base58</button>
            <button onclick="b58Encode(true)" style="width:auto;padding:0 18px;">HEX → Base58Check</button>
            <button onclick="b58Decode(false)" style="width:auto;padding:0 18px;">Base58 → HEX</button>
            <button onclick="b58Decode(true)" style="width:auto;padding:0 18px;">Base58Check → HEX</button>
        </div>
        <div id="out_b58" style="margin-top:20px;"><pre style="color:#888;">[STATUS] Waiting for input...</pre></div>
            </div>
        </div>
    </div>

    <!-- Core crypto library -->
    <script src="../shared/lib.js"></script>

    <script src="script.js"></script>
